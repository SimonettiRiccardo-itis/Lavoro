<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Piattaforma Vendita</title>
</head>
<body>
<h1>MarketHub - Versione Base</h1>

<h2>1. Importa CSV</h2>
<input type="file" id="csvFileInput" accept=".csv" onchange="gestisciFile(this)">

<h2>2. Catalogo Prodotti</h2>
<div id="productContainer">Nessun prodotto caricato.</div>

<h2>3. Carrello</h2>
<div id="cartList">Il carrello è vuoto.</div>
<p><strong>Totale: € <span id="totaleCarrello">0.00</span></strong></p>

<h2>4. Anagrafica</h2>
<form id="registrationForm" onsubmit="return salvaAnagrafica(event)">
<input type="text" id="inputNome" placeholder="Nome" required>
<input type="text" id="inputCognome" placeholder="Cognome" required>
<button type="submit">Salva Anagrafica</button>
</form>
<p id="regMessage" style="display:none; color:green;">Salvato!</p>

<h2>5. Checkout</h2>
<button id="checkoutBtn" onclick="confermaOrdine()">Conferma Ordine</button>
<p id="checkoutMessage" style="font-weight:bold;"></p>

<script>

var listaProdotti = [];
var carrello = [];
var nomeCliente = null;
var cognomeCliente = null;
var anagraficaSalvata = false;

function gestisciFile(input) {
  var file = input.files[0];
  if (file == null) {
    return;
  }

  var reader = new FileReader();

  reader.onreadystatechange = function() {
    if (reader.readyState == 2) {
      var testo = reader.result;
      var righe = testo.split('\n');

      listaProdotti = [];

      for (var i = 0; i < righe.length; i++) {
        if (i == 0) {
          i = 1;
        }
        var colonne = righe[i].split(',');
        var nome = colonne[1];
        var prezzo = colonne[5];
        if (nome == undefined) {
          nome = 'Senza nome';
        }
        if (prezzo == undefined || prezzo == '') {
          prezzo = 0;
        }
        var prodotto = new Object();
        prodotto.id = i;
        prodotto.nome = nome;
        prodotto.prezzo = parseFloat(prezzo);
        if (isNaN(prodotto.prezzo)) {
          prodotto.prezzo = 0;
        }
        listaProdotti.push(prodotto);
      }

      mostraProdotti();
    }
  }

  reader.readAsText(file);
}

function mostraProdotti() {
  var contenitore = document.getElementById('productContainer');
  var html = '';

  for (var i = 0; i < listaProdotti.length; i++) {
    var p = listaProdotti[i];
    var riga = '<div>' + p.nome + ' - € ' + p.prezzo;
    riga = riga + ' <button onclick="addToCart(' + i + ')">Aggiungi</button>';
    riga = riga + '</div>';
    html = html + riga;
  }

  if (html == '') {
    html = 'Nessun prodotto caricato.';
  }
  contenitore.innerHTML = html;
}

function addToCart(indice) {
  var prodottoDaAggiungere = listaProdotti[indice];
  var copia = new Object();
  copia.nome = prodottoDaAggiungere.nome;
  copia.prezzo = prodottoDaAggiungere.prezzo;
  carrello.push(copia);
  aggiornaCarrello();
}

function aggiornaCarrello() {
  var divCarrello = document.getElementById('cartList');
  var html = '';
  var totale = 0;

  for (var i = 0; i < carrello.length; i++) {
    var articolo = carrello[i];
    html = html + '<div>' + articolo.nome + ' - € ' + articolo.prezzo;
    html = html + ' <button onclick="removeFromCart(' + i + ')">Rimuovi</button>';
    html = html + '</div>';
    totale = totale + articolo.prezzo;
  }

  if (carrello.length == 0) {
    divCarrello.innerHTML = 'Il carrello è vuoto.';
  } else {
    divCarrello.innerHTML = html;
  }

  document.getElementById('totaleCarrello').textContent = totale.toFixed(2);
}

function removeFromCart(i) {
  var nuovoCarrello = [];
  for (var j = 0; j < carrello.length; j++) {
    if (j != i) {
      nuovoCarrello.push(carrello[j]);
    }
  }
  carrello = nuovoCarrello;
  aggiornaCarrello();
}

function salvaAnagrafica(event) {
  event.preventDefault();
  nomeCliente = document.getElementById('inputNome').value;
  cognomeCliente = document.getElementById('inputCognome').value;
  anagraficaSalvata = true;
  document.getElementById('regMessage').style.display = 'block';
  document.getElementById('checkoutMessage').textContent = '';
  return false;
}

function confermaOrdine() {
  var msg = document.getElementById('checkoutMessage');

  if (anagraficaSalvata == false) {
    msg.style.color = 'red';
    msg.textContent = 'Errore: Compila e salva prima l\'anagrafica.';
    return;
  }

  if (carrello.length == 0) {
    msg.style.color = 'red';
    msg.textContent = 'Errore: Il carrello è vuoto.';
    return;
  }

  var totaleFinale = 0;
  for (var i = 0; i < carrello.length; i++) {
    totaleFinale = totaleFinale + carrello[i].prezzo;
  }

  msg.style.color = 'green';
  msg.textContent = 'Ordine confirmed per ' + nomeCliente + ' ' + cognomeCliente + '. Totale: € ' + totaleFinale.toFixed(2);
}

</script>
</body>
</html>
